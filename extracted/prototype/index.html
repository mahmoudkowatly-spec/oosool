<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أصول | إدارة المشروعات</title>
<style>
:root{--g:#174638;--g2:#e7f0e9;--ink:#25352e;--muted:#7d8982;--line:#e6ebe7;--bg:#f6f8f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif}.layout{display:flex;min-height:100vh}.side{width:235px;background:#fff;border-left:1px solid var(--line);padding:24px 15px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:0 9px 25px;color:var(--g)}.mark{width:40px;height:40px;border-radius:12px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:21px;font-weight:bold}.brand b{display:block}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.side label{color:#a1aaa4;font-size:10px;padding:0 11px 8px}.nav{display:grid;gap:4px}.nav button{border:0;text-align:right;background:transparent;color:#66726b;border-radius:9px;padding:12px;font-size:13px}.nav button:hover,.nav button.on{color:var(--g);background:var(--g2);font-weight:bold}.user{margin-top:auto;border-top:1px solid var(--line);padding:16px 8px 0;font-size:12px}.user small{display:block;color:var(--muted);margin-top:4px}.main{flex:1;min-width:0}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:12px}.badge{background:#f5efdf;color:#82653b;border-radius:20px;padding:7px 10px;font-size:10px}.content{padding:28px;max-width:1350px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px}.head h1{font-size:23px;margin:0 0 6px}.head p{color:var(--muted);font-size:12px;margin:0}.buttons{display:flex;gap:8px}.btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 13px;font-size:12px;cursor:pointer;color:#536158}.btn.mainbtn{background:var(--g);color:#fff;border-color:var(--g)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #173c2d08}.card{padding:16px}.card small{color:var(--muted);font-size:11px}.card strong{display:block;margin:15px 0 5px;font-size:22px}.card em{font-style:normal;color:var(--muted);font-size:10px}.columns{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.panel{padding:17px;margin-bottom:14px}.panel h2{font-size:14px;margin:0 0 15px}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{color:#87928c;font-size:10px;font-weight:normal;text-align:right;padding:10px 8px;border-bottom:1px solid var(--line)}.table td{font-size:11px;padding:12px 8px;border-bottom:1px solid #f1f3f1}.status{border-radius:20px;padding:5px 9px;color:#397455;background:#eaf3ed;font-size:10px}.muted{color:var(--muted);font-size:10px;margin-top:4px}.tools{display:flex;gap:8px;margin-bottom:13px}.tools input,.tools select{padding:9px;border:1px solid var(--line);border-radius:8px;background:white}.notice{color:#627168;font-size:11px;line-height:1.8;background:#f4f7f4;padding:12px;border-radius:9px}.plus{color:#3d805e}.minus{color:#b95e58}.tablewrap{overflow:auto}.split{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mini{background:#f8faf8;padding:13px;border-radius:9px}.mini small{display:block;color:var(--muted);font-size:10px}.mini b{display:block;margin-top:8px}.clients{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.client{padding:17px;background:#fff;border:1px solid var(--line);border-radius:11px;font-size:12px}.client small{color:var(--muted)}.toast{position:fixed;bottom:20px;left:20px;background:#203f34;color:white;padding:12px 16px;border-radius:9px;display:none;font-size:12px;z-index:20}.modalback{position:fixed;inset:0;background:#10271dcc;display:grid;place-items:center;padding:16px;z-index:15}.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:22px;box-shadow:0 20px 70px #10271d55}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.modalhead h2{font-size:17px;margin:0}.modalclose{border:0;background:#eff3ef;border-radius:7px;padding:7px 11px;cursor:pointer}.modalform{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modalform label{font-size:11px;color:#68776e}.modalform label.full{grid-column:1/-1}.modalform input,.modalform select,.modalform textarea{display:block;width:100%;padding:10px;margin-top:5px;border:1px solid #dde6df;border-radius:8px;font:inherit;font-size:12px}.modalform textarea{min-height:75px;resize:vertical}.modalactions{grid-column:1/-1;display:flex;gap:8px;margin-top:6px}
@media(max-width:900px){.side{width:190px}.stats{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}}@media(max-width:600px){.layout{display:block}.side{width:100%;padding:10px}.brand{padding-bottom:10px}.side label,.user{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px;font-size:11px}.top{height:50px;padding:0 14px}.content{padding:18px 12px}.stats{gap:8px}.card{padding:12px}.card strong{font-size:18px}.head{align-items:flex-start;flex-direction:column}.clients{grid-template-columns:1fr}.split{grid-template-columns:1fr}}
</style></head><body><div class="layout"><aside class="side"><div class="brand"><div class="mark">أ</div><div><b>أصول</b><small>للهندسة والتشطيبات</small></div></div><label>مساحة العمل</label><nav class="nav" id="nav"></nav><div class="user"><b>مدير المكتب</b><small>مسؤول النظام</small></div></aside><main class="main"><header class="top"><span id="crumb">أصول / الرئيسية</span><span class="badge">نسخة أولية · بيانات تجريبية</span></header><div id="content" class="content"></div></main></div><div id="toast" class="toast"></div><div id="modal-root"></div>
<script>
var key="aousol-local-demo";
var seed={projects:[{id:"P-104",name:"تشطيب شقة النخيل",client:"عميل تجريبي",stage:"التنفيذ",progress:62,fee:12,status:"جاري"},{id:"P-103",name:"تجديد مكتب إداري",client:"شركة تجريبية",stage:"المراجعة",progress:84,fee:10,status:"مراجعة"},{id:"P-102",name:"تشطيب فيلا الياسمين",client:"عميل تجريبي",stage:"التأسيس",progress:28,fee:15,status:"جاري"}],tx:[{project:"P-104",type:"تحصيل",amount:85000,date:"2026-06-01",desc:"دفعة تعاقد"},{project:"P-104",type:"مصروف",amount:32000,date:"2026-06-04",desc:"مواد تأسيس"},{project:"P-103",type:"مصروف",amount:18500,date:"2026-06-08",desc:"أعمال كهرباء"}]};
function loadData(){try{var raw=window.localStorage.getItem(key);return raw?JSON.parse(raw):seed}catch(e){return seed}} var data=loadData(),view="home",labels={home:"الرئيسية",projects:"المشروعات",clients:"العملاء",finance:"الحسابات",reports:"التقارير",settings:"الإعدادات"};
function money(n){return new Intl.NumberFormat("ar-EG",{maximumFractionDigits:0}).format(n)+" ج.م"}
function save(){try{window.localStorage.setItem(key,JSON.stringify(data))}catch(e){toast("التغييرات مؤقتة في هذه الجلسة")}}
function sum(type){return data.tx.filter(function(t){return t.type===type}).reduce(function(s,t){return s+t.amount},0)}
function pr(id){return data.projects.find(function(p){return p.id===id})}
function feeTotal(){return data.projects.reduce(function(s,p){return s+data.tx.filter(function(t){return t.project===p.id&&t.type==="مصروف"}).reduce(function(a,t){return a+t.amount*feeAt(p,t.date)/100},0)},0)}
function toast(t){var x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(function(){x.style.display="none"},2200)}
function go(v){view=v;render()}
function head(title,sub,buttons){return '<div class="head"><div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="buttons">'+(buttons||"")+'</div></div>'}
function btn(text,act,primary){return '<button class="btn '+(primary?"mainbtn":"")+'" onclick="'+act+'">'+text+'</button>'}
function rows(list){return list.map(function(p){return '<tr><td><b>'+p.name+'</b><div class="muted">'+p.id+' · '+p.client+'</div></td><td>'+p.stage+'</td><td>'+p.progress+'%</td><td><span class="status">'+p.status+'</span></td><td>'+p.fee+'%</td></tr>'}).join("")}
function tableProjects(list){return '<div class="tablewrap"><table class="table"><thead><tr><th>المشروع / العميل</th><th>المرحلة</th><th>التقدم</th><th>الحالة</th><th>رسوم المكتب</th></tr></thead><tbody>'+rows(list)+'</tbody></table></div>'}
function metric(title,val,note){return '<div class="card"><small>'+title+'</small><strong>'+val+'</strong><em>'+note+'</em></div>'}
function transactionRows(){return data.tx.slice().reverse().map(function(t){var p=pr(t.project),isIn=t.type==="تحصيل";return '<tr><td>'+t.date+'</td><td>'+(p?p.name:"—")+'</td><td>'+t.type+'</td><td>'+t.desc+'</td><td class="'+(isIn?"plus":"minus")+'">'+(isIn?"+":"−")+money(t.amount)+'</td></tr>'}).join("")}
function render(){document.getElementById("crumb").textContent="أصول / "+labels[view];document.getElementById("nav").innerHTML=Object.keys(labels).map(function(k){return '<button class="'+(view===k?"on":"")+'" onclick="go(\''+k+'\')">'+labels[k]+'</button>'}).join("");var c=document.getElementById("content"),net=sum("تحصيل")-sum("مصروف");
if(view==="home"){c.innerHTML=head("أهلاً بك في أصول","نظرة سريعة على مشروعات المكتب وحركتها المالية",btn("＋ حركة مالية","addTx()",false)+btn("＋ مشروع جديد","addProject()",true))+'<div class="stats">'+metric("المشروعات النشطة",data.projects.length,"مشروعات مسجلة")+metric("التحصيلات",money(sum("تحصيل")),"دفعات مستلمة")+metric("المصروفات",money(sum("مصروف")),"مصروفات المشروع")+metric("صافي حركة المشروعات",money(net),"التحصيلات ناقص المصروفات")+'</div><div class="columns"><section class="panel"><h2>المشروعات الأخيرة</h2>'+tableProjects(data.projects.slice(0,4))+'</section><section class="panel"><h2>ملخص مالي</h2><div class="split"><div class="mini"><small>التحصيلات</small><b class="plus">'+money(sum("تحصيل"))+'</b></div><div class="mini"><small>المصروفات</small><b class="minus">−'+money(sum("مصروف"))+'</b></div><div class="mini"><small>رسوم المكتب</small><b>'+money(feeTotal())+'</b></div></div><p class="notice">الرسوم منفصلة عن حركة النقد، وتُحسب على كل مصروفات المشروع المسجلة مع استثناء الرسوم نفسها.</p></section></div>'}
else if(view==="projects"){c.innerHTML=head("المشروعات","إدارة العملاء والمراحل والتقدم ورسوم المكتب",btn("＋ مشروع جديد","addProject()",true))+'<section class="panel"><div class="tools"><input id="search" placeholder="ابحث عن مشروع أو عميل"><select id="status"><option value="">كل الحالات</option><option>جاري</option><option>مراجعة</option></select></div><div id="plist">'+tableProjects(data.projects)+'</div></section>';document.getElementById("search").oninput=filter;document.getElementById("status").onchange=filter}
else if(view==="clients"){var cs=[...new Set(data.projects.map(function(p){return p.client}))];c.innerHTML=head("العملاء","العملاء المرتبطون بمشروعات المكتب",btn("＋ إضافة عميل","addClient()",true))+'<div class="clients">'+cs.map(function(n){return '<article class="client"><b>'+n+'</b><p><small>عميل · بيانات تجريبية</small></p><small>المشروعات: '+data.projects.filter(function(p){return p.client===n}).length+'</small></article>'}).join("")+'</div>'}
else if(view==="finance"){c.innerHTML=head("الحسابات","تسجيل التحصيلات والمصروفات ومراجعة حركة كل مشروع",btn("＋ حركة مالية","addTx()",true))+'<div class="stats">'+metric("التحصيلات",money(sum("تحصيل")),"تظهر موجبة")+metric("المصروفات",money(sum("مصروف")),"تظهر سالبة")+metric("صافي الحركة",money(net),"التحصيلات ناقص المصروفات")+metric("رسوم المكتب",money(feeTotal()),"تُعرض بشكل مستقل")+'</div><div class="panel"><h2>سجل الحركات</h2><div class="tablewrap"><table class="table"><thead><tr><th>التاريخ</th><th>المشروع</th><th>النوع</th><th>البيان</th><th>المبلغ</th></tr></thead><tbody>'+transactionRows()+'</tbody></table></div></div>'}
else if(view==="reports"){c.innerHTML=head("التقارير","ملخصات تشغيلية ومالية للنسخة الأولية")+'<div class="stats">'+metric("إجمالي التحصيلات",money(sum("تحصيل")),"من الحركات التجريبية")+metric("إجمالي المصروفات",money(sum("مصروف")),"من الحركات التجريبية")+metric("صافي حركة المشروع",money(net),"تحصيلات ناقص مصروفات")+metric("رسوم المكتب المقدرة",money(feeTotal()),"منفصلة عن النقد")+'</div><div class="panel"><h2>ملخص كل مشروع</h2>'+tableProjects(data.projects)+'</div>'}
else {c.innerHTML=head("الإعدادات","هوية المكتب ونسب رسوم المشروعات")+'<div class="panel"><h2>رسوم المكتب حسب المشروع</h2><div class="tablewrap"><table class="table"><thead><tr><th>المشروع</th><th>النسبة</th><th>المصروفات المسجلة</th><th>الرسوم المقدرة</th><th></th></tr></thead><tbody>'+data.projects.map(function(p){var expensesForProject=data.tx.filter(function(t){return t.project===p.id&&t.type==="مصروف"}),e=expensesForProject.reduce(function(s,t){return s+t.amount},0),f=expensesForProject.reduce(function(s,t){return s+t.amount*feeAt(p,t.date)/100},0);return "<tr><td>"+p.name+"</td><td>"+p.fee+"%</td><td>"+money(e)+"</td><td>"+money(f)+"</td><td><button class=btn onclick=\"editFee(\'"+p.id+"\')\">تعديل</button></td></tr>"}).join("")+'</tbody></table></div></div><p class="notice">نسخة أولية تعمل محليًا ببيانات تجريبية؛ لم تُربط بعد بقاعدة بيانات أو حسابات مستخدمين.</p>'}}
function filter(){var q=document.getElementById("search").value.toLowerCase(),s=document.getElementById("status").value;var l=data.projects.filter(function(p){return (p.name+" "+p.client+" "+p.id).toLowerCase().includes(q)&&(!s||p.status===s)});document.getElementById("plist").innerHTML=tableProjects(l)}
function showModal(title,fields,submit){
var root=document.getElementById("modal-root");
root.innerHTML='<div class="modalback"><section class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h2>'+title+'</h2><button class="modalclose" type="button" data-close>إغلاق</button></div><form class="modalform">'+fields+'<div class="modalactions"><button class="btn mainbtn" type="submit">حفظ</button><button class="btn" type="button" data-close>إلغاء</button></div></form></section></div>';
var back=root.querySelector(".modalback"),form=root.querySelector("form");
root.querySelectorAll("[data-close]").forEach(function(b){b.addEventListener("click",function(){root.innerHTML=""})});
back.addEventListener("click",function(e){if(e.target===back)root.innerHTML=""});
form.addEventListener("submit",function(e){e.preventDefault();submit(new FormData(form));root.innerHTML=""});
}
function addProject(){
var today=new Date().toISOString().slice(0,10);
showModal("مشروع جديد",'<label class="full">اسم المشروع *<input name="name" required placeholder="مثال: تشطيب شقة"></label><label>اسم العميل *<input name="client" required placeholder="اسم العميل"></label><label>نوع المشروع<select name="type"><option>تشطيب للغير</option><option>شراء وتجهيز وبيع</option></select></label><label>نسبة رسوم المكتب % *<input name="fee" type="number" min="0" max="100" step="0.1" value="12" required></label><label>المرحلة<select name="stage"><option>المعاينة</option><option>التصميم</option><option>التنفيذ</option><option>المراجعة</option></select></label><label>تاريخ البداية<input name="date" type="date" value="'+today+'"></label><label class="full">ملاحظات<textarea name="notes"></textarea></label>',
function(f){var name=String(f.get("name")||"").trim(),client=String(f.get("client")||"").trim(),rate=Number(f.get("fee"));if(!name||!client||rate<0||rate>100){toast("راجع الحقول المطلوبة");return}var date=f.get("date")||today;data.projects.unshift({id:"P-"+Date.now().toString().slice(-5),name:name,client:client,stage:f.get("stage"),progress:0,fee:rate,status:"جاري",rateHistory:[{rate:rate,effectiveFrom:date}]});save();render();toast("تمت إضافة المشروع")})
}
function addClient(){showModal("إضافة عميل",'<label class="full">اسم العميل *<input name="name" required></label><label>رقم التواصل<input name="phone"></label><label>البريد الإلكتروني<input name="email" type="email"></label><label class="full">ملاحظات<textarea name="notes"></textarea></label>',function(f){var n=String(f.get("name")||"").trim();if(!n)return;data.projects.unshift({id:"C-"+Date.now().toString().slice(-5),name:"ملف عميل",client:n,stage:"عميل جديد",progress:0,fee:0,status:"جاري"});save();render();toast("تمت إضافة العميل إلى العرض التجريبي")})}
function addTx(){
if(!data.projects.length){toast("أضف مشروعًا أولًا");return}
var options=data.projects.map(function(p){return '<option value="'+p.id+'">'+p.name+'</option>'}).join(""),today=new Date().toISOString().slice(0,10);
showModal("حركة مالية جديدة",'<label class="full">المشروع *<select name="project" required>'+options+'</select></label><label>نوع الحركة<select name="type"><option>مصروف</option><option>تحصيل</option></select></label><label>المبلغ *<input name="amount" type="number" min="0.01" step="0.01" required placeholder="0"></label><label>التاريخ<input name="date" type="date" value="'+today+'" required></label><label class="full">البيان *<input name="desc" required placeholder="دفعة عميل أو شراء مواد"></label>',
function(f){var amount=Number(f.get("amount"));if(!(amount>0)){toast("أدخل مبلغًا صحيحًا");return}data.tx.push({project:f.get("project"),type:f.get("type"),amount:amount,date:f.get("date")||today,desc:String(f.get("desc")||"").trim()});save();render();toast("تم تسجيل الحركة")})
}
function feeAt(p,date){var h=(p.rateHistory||[]).filter(function(r){return !r.effectiveFrom||r.effectiveFrom<=date}).sort(function(a,b){return String(a.effectiveFrom||"").localeCompare(String(b.effectiveFrom||""))});return h.length?Number(h[h.length-1].rate):Number(p.fee||0)}
function editFee(id){
var p=pr(id),today=new Date().toISOString().slice(0,10);
showModal("تعديل نسبة رسوم المكتب",'<p class="notice" style="grid-column:1/-1;margin:0">تسري النسبة الجديدة من التاريخ المحدد، وتبقى الحركات السابقة على نسبتها السابقة.</p><label>النسبة الجديدة % *<input name="fee" type="number" min="0" max="100" step="0.1" value="'+Number(p.fee||0)+'" required></label><label>تاريخ السريان *<input name="date" type="date" value="'+today+'" required></label>',
function(f){var rate=Number(f.get("fee")),date=f.get("date");if(rate<0||rate>100||!date){toast("راجع النسبة والتاريخ");return}if(!p.rateHistory)p.rateHistory=[{rate:Number(p.fee||0),effectiveFrom:"0001-01-01"}];p.rateHistory.push({rate:rate,effectiveFrom:date});p.fee=rate;save();render();toast("تم تحديث النسبة")})
}
render();
</script></body></html>
